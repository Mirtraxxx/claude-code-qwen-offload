# Optional: ~/.omp/agent/config.yml (Windows: %USERPROFILE%\.omp\agent\config.yml).
# Makes the local 27B the model for every omp role, so omp never reaches for a cloud model.
defaultThinkingLevel: medium
modelRoles:
  default: llamacpp/qwen3.8-27b:medium
  smol: llamacpp/qwen3.8-27b:low
  slow: llamacpp/qwen3.8-27b:high
  task: llamacpp/qwen3.8-27b:medium
  vision: llamacpp/qwen3.8-27b:medium
  plan: llamacpp/qwen3.8-27b:medium
  commit: llamacpp/qwen3.8-27b:low
  tiny: llamacpp/qwen3.8-27b:minimal
  advisor: llamacpp/qwen3.8-27b:medium

# Disable omp's multi-agent fan-out (bundled task agents): with one local GPU they only compete
# for the same server slots. Remove this block to restore subagent delegation.
task:
  disabledAgents:
    - scout
    - reviewer
    - security-reviewer
    - task
    - sonic

# Compaction tuned for two workers sharing the 27B's 160k context pool.
# - thresholdTokens 52000: two workers x (52k prompt + 26k reply) fit the pool.
# - keepRecentTokens 8000: at the default 20000, workers re-hit the threshold 2-3 turns after compacting.
# - methodOrder: the default snapcompact archives history as images of text that the 27B can't read back,
#   so workers thrash (compact, re-read, compact). A handoff is an LLM call (1-3 min at low).
compaction:
  thresholdTokens: 52000
  keepRecentTokens: 8000
  methodOrder:
    - handoff
    - soft
    - shake
