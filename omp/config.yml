# Optional: ~/.omp/agent/config.yml (Windows: %USERPROFILE%\.omp\agent\config.yml).
# Makes the local 27B the model for every omp role, so omp never reaches for a cloud model.
# If PI_CODING_AGENT_DIR is set, omp reads this file from that folder instead. To change one key, run
# `omp config set <key> <value>` from bash (PowerShell strips the quotes from JSON arrays).
defaultThinkingLevel: medium
modelRoles:
  default: llamacpp/qwen3.8-27b:medium
  smol: llamacpp/qwen3.8-27b:low
  slow: llamacpp/qwen3.8-27b:high
  task: llamacpp/qwen3.8-27b:medium
  vision: llamacpp/qwen3.8-27b:medium
  plan: llamacpp/qwen3.8-27b:medium
  commit: llamacpp/qwen3.8-27b:low
  tiny: llamacpp/qwen3.8-27b:minimal
  advisor: llamacpp/qwen3.8-27b:medium

# Disable omp's multi-agent fan-out (bundled task agents): with one local GPU they only compete
# for the same server slots. Remove this block to restore subagent delegation.
task:
  disabledAgents:
    - scout
    - reviewer
    - security-reviewer
    - task
    - sonic

# Context compaction, tuned so two workers share the server's 128k KV pool (about half each).
# - thresholdTokens 40000: compact well before the pool fills, leaving room for the reply.
# - keepRecentTokens 8000: at the default (20000), workers hit the threshold again 2-3 turns later.
# - methodOrder: the default starts with snapcompact, which archives history as images of text. The 27B
#   can't read those back, so workers thrash (compact, re-read, compact). A handoff is an LLM-written
#   summary of the goal and of the done and pending work; it takes 1-3 min at low thinking.
compaction:
  thresholdTokens: 40000
  keepRecentTokens: 8000
  methodOrder:
    - handoff
    - soft
    - shake
